name: offline-validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,video]"
      - name: Unit and integration tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Dependency consistency
        run: python -m pip check
      - name: Rebuild focused delay figures
        run: python references/client_delay_comparison/rebuild_figures.py
      - name: Synthetic end-to-end workflow
        run: |
          openet2 generate-example --output-root .ci-example
          openet2 run --data-root .ci-example --output-root .ci-output
